[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "new-sbt-aio"
version = "2.0.0"
description = "Async Telegram schedule bot for BSAC (Belarussian State Academy of Communications)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.13.0",
    "alembic>=1.13.0",
    "apscheduler>=3.10.4",
    "asyncpg>=0.30.0",
    "beautifulsoup4>=4.12.0",
    "httpx>=0.27.0",
    "pdfplumber>=0.11.0",
    "pydantic-settings>=2.5.0",
    "redis>=5.0.0",
    "sqlalchemy[asyncio]>=2.0.35",
]

[project.optional-dependencies]
dev = [
    "aiosqlite>=0.20.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[project.scripts]
sbt-bot = "sbt_bot.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/sbt_bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "ASYNC"]
